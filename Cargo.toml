[package]
name = "tuxhub-always-online"
version = "0.1.0"
edition = "2024"
description = "Keeps Discord, Steam and other apps from setting you to away while you are at the computer"
license = "MIT"
authors = ["SirSnolte"]
repository = "https://github.com/SirSnolte/tuxhub-always-online"

[dependencies]
evdev = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
